<main class="container">
    <h2 class="section-title">Fale Conosco / Encomendas</h2>
    <div style="max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px;">
        <form style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" placeholder="Seu Nome Completo" style="padding: 12px; background: #000; border: 1px solid #333; color: #fff; font-family: var(--font-body);">
            <input type="email" placeholder="Seu E-mail" style="padding: 12px; background: #000; border: 1px solid #333; color: #fff; font-family: var(--font-body);">
            <select style="padding: 12px; background: #000; border: 1px solid #333; color: #fff; font-family: var(--font-body);">
                <option>Selecione o Modelo desejado</option>
                <option>Cyber X-200</option>
                <option>Aero GT-Hyper</option>
                <option>Stealth V-EV</option>
            </select>
            <button type="submit" class="btn">Enviar Proposta</button>
        </form>
    </div>
</main>
